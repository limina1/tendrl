[workspace]
resolver = "2"

members = [
    "crates/tendrl_core",
    "crates/tendrl_daemon",
    "crates/tendrl_query",
    "crates/enostr",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Tendrl Contributors"]
repository = "https://github.com/yourusername/tendrl"

[workspace.dependencies]
# Core dependencies
nostrdb = { git = "https://github.com/damus-io/nostrdb-rs", rev = "2b2e5e43c019b80b98f1db6a03a1b88ca699bfa3" }
enostr = "0.3.0"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# CLI
clap = { version = "4.5", features = ["derive"] }

# Async
tokio = { version = "1.16", features = ["macros", "rt-multi-thread"] }

# Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Utilities
hex = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4"] }

# Internal crates
tendrl_core = { path = "crates/tendrl_core" }
