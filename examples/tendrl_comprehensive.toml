# Tendrl Comprehensive Feed Configuration
# Inspired by flux/nostr-feeds, adapted to Tendrl's config-driven architecture
#
# Key Differences from flux:
# - Tendrl uses notedeck fetching + nostrdb (LMDB) storage
# - flux uses nak fetching + SQLite storage
# - Both use Jinja2 templating
# - Tendrl's hybrid pattern: local queries + remote streaming

npub = "npub1m3xdppkd0njmrqe2ma8a6ys39zvgp5k8u22mev8xsnqp4nh80srqhqa5sf"
pubkey = "dc4cd086cd7ce5b1832adf4fdd1211289880d2c7e295bcb0e684c01acee77c06"
name = "liminal"
db_path = "/home/user/.local/share/tendrl/nostrdb"

# Profile fetcher relays - specialized indexers for kind-0 events
[profile_fetchers]
relays = [
    "wss://purplepag.es",
    "wss://indexer.coracle.social",
    "wss://user.kindpag.es",
    "wss://relay.nostr.band",
    "wss://relay.damus.io",
    "wss://theforest.nostr1.com",
    "wss://thecitadel.nostr1.com"
]

# ============================================================================
# TIMELINE FEED - Follow-filtered notes and reposts
# ============================================================================

[feed.timeline]
name = "Timeline"
description = "Notes and reposts from your follows"
display_kinds = [1, 6]  # Notes and reposts
mode = "follows"  # Filter by follow list
relay_mode = "general"
fetch_strategy = "stream"

[feed.timeline.pattern]
filter_type = "hybrid"

# Backfill: Notes and engagement data
[[feed.timeline.pattern.local_queries]]
kinds = [1, 6]
limit = 100
note = "Backfill timeline notes and reposts"

[[feed.timeline.pattern.local_queries]]
kinds = [7, 9735, 0]
limit = 2000
note = "Backfill engagement data"

# Stream: Real-time updates
[[feed.timeline.pattern.remote_filters]]
kinds = [1, 6, 7, 9735, 0]
limit = 250

[feed.timeline.root]
kind = 1
template = "short-note-card.j2"

[feed.timeline.root.deps.author]
kind = 0
relation = "author"
required = true

[feed.timeline.root.deps.parent_note]
kind = 1
relation = "e_tag"
mode = "single"
required = false

[feed.timeline.root.deps.parent_author]
kind = 0
relation = "parent_author"
required = false

[feed.timeline.root.deps.reactions]
kind = 7
relation = "e_tag"
mode = "aggregate"
stats = ["count", "by_content"]

[feed.timeline.root.deps.replies]
kind = 1
relation = "e_tag"
mode = "aggregate"
stats = ["count"]
expandable = true

[feed.timeline.root.deps.zaps]
kind = 9735
relation = "e_tag"
mode = "aggregate"
stats = ["count", "total_sats"]
expandable = true

[feed.timeline.root.deps.reposts]
kind = 6
relation = "e_tag"
mode = "aggregate"
stats = ["count"]
expandable = true

[feed.timeline.root.deps.reposted_event]
relation = "repost_content"
mode = "expanded"
max_depth = 3
required = false

[feed.timeline.root.deps.reposted_author]
kind = 0
relation = "reposted_author"
required = false

