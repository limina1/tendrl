{% extends "base.html" %}

{% block title %}Publication - Tendrl{% endblock %}

{% block head %}
<!-- AsciiDoc content is pre-rendered server-side using asciidoctor binary -->
<style>
    /* Two-column publication layout */
    .publication-container {
        display: flex;
        min-height: calc(100vh - 64px);
        max-width: 1400px;
        margin: 0 auto;
        padding: 1rem;
        gap: 2rem;
    }

    /* TOC Sidebar */
    .toc-sidebar {
        width: 280px;
        flex-shrink: 0;
        position: sticky;
        top: 80px;
        height: calc(100vh - 96px);
        overflow-y: auto;
        padding-right: 1rem;
        border-right: 1px solid var(--border-color);
    }

    .toc-header {
        padding: 1rem 0;
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 1rem;
    }

    .toc-title {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-primary);
        margin-bottom: 0.25rem;
    }

    .toc-subtitle {
        font-size: 0.875rem;
        color: var(--text-secondary);
    }

    .toc-list {
        list-style: none;
        padding: 0;
        margin: 0;
    }

    .toc-item {
        margin-bottom: 0.25rem;
    }

    .toc-link {
        display: block;
        padding: 0.5rem 0.75rem;
        border-radius: 0.375rem;
        color: var(--text-secondary);
        text-decoration: none;
        font-size: 0.875rem;
        transition: all 0.15s;
        cursor: pointer;
    }

    .toc-link:hover {
        background: var(--bg-secondary);
        color: var(--text-primary);
    }

    .toc-link.active {
        background: var(--primary-300);
        color: var(--text-primary);
        border-left: 4px solid var(--primary-600);
        font-weight: 500;
    }

    .dark .toc-link.active {
        background: var(--primary-700);
        border-left-color: var(--primary-400);
    }

    .toc-link.loading {
        opacity: 0.5;
    }

    /* Main Content */
    .content-main {
        flex: 1;
        max-width: 800px;
        padding-bottom: 4rem;
    }

    .pub-header {
        margin-bottom: 2rem;
        padding-bottom: 1rem;
        border-bottom: 1px solid var(--border-color);
    }

    .pub-title {
        font-size: 2rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
    }

    .pub-meta {
        display: flex;
        flex-wrap: wrap;
        gap: 1rem;
        font-size: 0.875rem;
        color: var(--text-secondary);
    }

    .pub-meta-item {
        display: flex;
        align-items: center;
        gap: 0.5rem;
    }

    /* Section Content */
    .section-container {
        margin-bottom: 2rem;
        scroll-margin-top: 100px;
    }

    .section-header {
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--text-primary);
        margin-bottom: 1rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
    }

    .section-content {
        line-height: 1.7;
        color: var(--text-primary);
    }

    /* AsciiDoc rendered content styles */
    .section-content h1, .section-content h2, .section-content h3,
    .section-content h4, .section-content h5, .section-content h6 {
        color: var(--text-primary);
        margin-top: 1.5rem;
        margin-bottom: 0.75rem;
    }

    .section-content p {
        margin-bottom: 1rem;
    }

    .section-content ul, .section-content ol {
        margin-left: 1.5rem;
        margin-bottom: 1rem;
    }

    .section-content li {
        margin-bottom: 0.25rem;
    }

    .section-content blockquote {
        border-left: 4px solid var(--accent-primary);
        padding-left: 1rem;
        margin: 1rem 0;
        color: var(--text-secondary);
        font-style: italic;
    }

    .section-content pre {
        background: var(--bg-tertiary);
        padding: 1rem;
        border-radius: 0.5rem;
        overflow-x: auto;
        margin: 1rem 0;
    }

    .section-content code {
        background: var(--bg-tertiary);
        padding: 0.125rem 0.375rem;
        border-radius: 0.25rem;
        font-size: 0.875em;
    }

    .section-content pre code {
        background: none;
        padding: 0;
    }

    .section-content img {
        max-width: 100%;
        border-radius: 0.5rem;
        margin: 1rem 0;
    }

    .section-content a {
        color: var(--accent-primary);
        text-decoration: underline;
    }

    /* Loading state */
    .section-loading {
        padding: 2rem;
        text-align: center;
        color: var(--text-muted);
    }

    .section-loading .spinner {
        width: 24px;
        height: 24px;
        border: 3px solid var(--border-color);
        border-top-color: var(--primary-600);
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 0 auto 1rem;
    }

    .dark .section-loading .spinner {
        border-top-color: var(--primary-400);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Responsive */
    @media (max-width: 1024px) {
        .publication-container {
            flex-direction: column;
        }

        .toc-sidebar {
            width: 100%;
            position: relative;
            top: 0;
            height: auto;
            max-height: 300px;
            border-right: none;
            border-bottom: 1px solid var(--border-color);
            padding-right: 0;
            padding-bottom: 1rem;
            margin-bottom: 1rem;
        }

        .content-main {
            max-width: 100%;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="publication-container">
    <!-- TOC Sidebar -->
    <aside class="toc-sidebar">
        <div class="toc-header">
            <div class="toc-title" id="pub-title">Loading...</div>
            <div class="toc-subtitle" id="pub-author"></div>
        </div>
        <nav>
            <ul class="toc-list" id="toc-tree">
                <!-- TOC entries loaded dynamically -->
                <li class="toc-item">
                    <span class="toc-link loading">Loading table of contents...</span>
                </li>
            </ul>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="content-main">
        <header class="pub-header" id="pub-header">
            <h1 class="pub-title" id="content-title">Loading publication...</h1>
            <div class="pub-meta" id="pub-meta"></div>
        </header>

        <div id="sections-container">
            <!-- Sections loaded dynamically -->
            <div class="section-loading">
                <div class="spinner"></div>
                <p>Loading publication...</p>
            </div>
        </div>
    </main>
</div>

<script>
(function() {
    // AsciiDoc content is pre-rendered server-side using asciidoctor binary
    // No client-side rendering needed

    // Get publication type and identifier from URL
    // URL format: /publication/:type/:identifier (gc-alexandria compatible)
    const pathParts = window.location.pathname.split('/');
    const publicationType = pathParts[pathParts.length - 2];  // e.g., "naddr", "id", "d", "nevent"
    const publicationIdentifier = pathParts[pathParts.length - 1];  // the actual identifier

    // State
    const state = {
        publication: null,
        loadedSections: new Map(),
        activeSection: null
    };

    // Fetch and render publication
    async function loadPublication() {
        try {
            const response = await fetch(`/api/publication/${publicationType}/${publicationIdentifier}`);
            if (!response.ok) {
                throw new Error(`Publication not found: ${response.status}`);
            }

            const data = await response.json();
            state.publication = data;

            // Render header
            renderHeader(data);

            // Render TOC
            renderTOC(data);

            // Load all sections
            await loadAllSections(data);

        } catch (error) {
            console.error('Failed to load publication:', error);
            document.getElementById('sections-container').innerHTML = `
                <div style="text-align: center; padding: 3rem; color: var(--text-muted);">
                    <h2>Publication not found</h2>
                    <p>${error.message}</p>
                    <a href="/feed" class="btn btn-primary" style="margin-top: 1rem;">Back to Feed</a>
                </div>
            `;
        }
    }

    function renderHeader(data) {
        const event = data.index.event;
        const tags = event.tags || [];

        // Extract metadata
        const title = getTag(tags, 'title') || getTag(tags, 'd') || 'Untitled';
        const author = getTag(tags, 'author') || event.pubkey.substring(0, 16) + '...';
        const createdAt = new Date(event.created_at * 1000);

        // Update sidebar
        document.getElementById('pub-title').textContent = title;
        document.getElementById('pub-author').textContent = `by ${author}`;

        // Update main header
        document.getElementById('content-title').textContent = title;
        document.getElementById('pub-meta').innerHTML = `
            <div class="pub-meta-item">
                <span>Author:</span>
                <strong>${author}</strong>
            </div>
            <div class="pub-meta-item">
                <span>Published:</span>
                <strong>${createdAt.toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' })}</strong>
            </div>
            <div class="pub-meta-item">
                <span>Sections:</span>
                <strong>${data.toc.length}</strong>
            </div>
        `;

        // Update page title
        document.title = `${title} - Tendrl`;
    }

    function renderTOC(data) {
        const tocTree = document.getElementById('toc-tree');
        tocTree.innerHTML = '';

        data.toc.forEach((entry, index) => {
            const li = document.createElement('li');
            li.className = 'toc-item';

            const a = document.createElement('a');
            a.className = 'toc-link';
            a.textContent = entry.title;
            a.href = `#section-${index}`;
            a.onclick = (e) => {
                e.preventDefault();
                scrollToSection(index);
            };

            li.appendChild(a);
            tocTree.appendChild(li);
        });
    }

    async function loadAllSections(data) {
        const container = document.getElementById('sections-container');
        container.innerHTML = '';

        for (let i = 0; i < data.toc.length; i++) {
            const entry = data.toc[i];
            const sectionDiv = document.createElement('div');
            sectionDiv.className = 'section-container';
            sectionDiv.id = `section-${i}`;

            // Header
            const header = document.createElement('h2');
            header.className = 'section-header';
            header.textContent = entry.title;
            sectionDiv.appendChild(header);

            // Content placeholder
            const content = document.createElement('div');
            content.className = 'section-content';
            content.innerHTML = '<div class="section-loading"><div class="spinner"></div><p>Loading...</p></div>';
            sectionDiv.appendChild(content);

            container.appendChild(sectionDiv);

            // Load section content
            loadSectionContent(entry.address, content);
        }
    }

    async function loadSectionContent(address, contentDiv) {
        try {
            const response = await fetch(`/api/section/${encodeURIComponent(address)}`);
            if (!response.ok) {
                throw new Error('Section not found');
            }

            const data = await response.json();
            state.loadedSections.set(address, data);

            // Check if this is a nested index (kind 30040) vs actual content
            if (data.is_index && data.children && data.children.length > 0) {
                // This is a nested index - recursively fetch the first child's content
                // (like gc-alexandria does for chapter indices)
                const firstChild = data.children[0];
                if (firstChild && firstChild.address) {
                    await loadSectionContent(firstChild.address, contentDiv);
                    return;
                }
            }

            // Use pre-rendered HTML from server (asciidoctor binary)
            const html = data.html || '';
            if (html.trim()) {
                contentDiv.innerHTML = html;
            } else {
                contentDiv.innerHTML = '<p style="color: var(--text-muted);">No content</p>';
            }

        } catch (error) {
            console.error(`Failed to load section ${address}:`, error);
            contentDiv.innerHTML = `<p style="color: var(--text-muted);">Failed to load section content</p>`;
        }
    }

    function scrollToSection(index) {
        const section = document.getElementById(`section-${index}`);
        if (section) {
            section.scrollIntoView({ behavior: 'smooth' });
            setActiveSection(index);
        }
    }

    function setActiveSection(index) {
        // Update TOC highlighting
        const links = document.querySelectorAll('.toc-link');
        links.forEach((link, i) => {
            link.classList.toggle('active', i === index);
        });
        state.activeSection = index;
    }

    function getTag(tags, name) {
        const tag = tags.find(t => t[0] === name);
        return tag ? tag[1] : null;
    }

    // Intersection observer for automatic TOC highlighting
    function setupScrollObserver() {
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const index = parseInt(entry.target.id.replace('section-', ''));
                    setActiveSection(index);
                }
            });
        }, {
            rootMargin: '-100px 0px -50% 0px',
            threshold: 0
        });

        // Observe sections after they're loaded
        setTimeout(() => {
            document.querySelectorAll('.section-container').forEach(section => {
                observer.observe(section);
            });
        }, 1000);
    }

    // Initialize
    loadPublication();
    setupScrollObserver();
})();
</script>
{% endblock %}
